{% extends "base.html" %}
{% block title %}Log in - TraitMirror{% endblock %}
{% block content %}
<section class="auth-panel">
  <div class="eyebrow">Welcome back</div>
  <h1>Log in</h1>
  <p class="muted">Return to your reflection dashboard and suggested practices.</p>
  <form method="post" class="form-stack">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="primary" type="submit">Log in</button>
  </form>
  <p class="muted">New here? <a href="{% url 'signup' %}">Create an account</a>.</p>
</section>
{% endblock %}
