{% extends "base.html" %}
{% block title %}Sign up - TraitMirror{% endblock %}
{% block content %}
<section class="auth-panel">
  <div class="eyebrow">Start gently</div>
  <h1>Create your account</h1>
  <p class="muted">TraitMirror helps compare ideal priorities with current patterns through reflection and suggested practice.</p>
  <form method="post" class="form-stack">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="primary" type="submit">Start building</button>
  </form>
</section>
{% endblock %}
