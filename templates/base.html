{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TraitMirror{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <style>
    :root {
      --bg-0: #05070d;
      --bg-1: #08111f;
      --ink: #f5f7fb;
      --muted: rgba(245, 247, 251, 0.62);
      --soft: rgba(245, 247, 251, 0.09);
      --line: rgba(255, 255, 255, 0.12);
      --line-strong: rgba(255, 255, 255, 0.22);
      --accent: #9ee7ff;
      --accent-2: #c7a6ff;
      --good: #9cffcb;
      --warning: #ffd38a;
      --danger: #ff9aa8;
      --shadow: 0 42px 120px rgba(0, 0, 0, 0.42);
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: var(--bg-0);
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 12%, rgba(113, 169, 255, 0.20), transparent 34rem),
        radial-gradient(circle at 83% 17%, rgba(199, 166, 255, 0.18), transparent 30rem),
        radial-gradient(circle at 50% 86%, rgba(158, 231, 255, 0.10), transparent 44rem),
        linear-gradient(180deg, var(--bg-1), var(--bg-0) 58%, #030409);
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -2;
    }

    body::before {
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: linear-gradient(to bottom, transparent, rgba(0, 0, 0, 0.7) 18%, rgba(0, 0, 0, 0.35) 58%, transparent);
      transform: perspective(900px) rotateX(58deg) translateY(18vh) scale(1.4);
      transform-origin: center bottom;
    }

    body::after {
      z-index: -1;
      background:
        radial-gradient(circle at 48% 18%, rgba(255, 255, 255, 0.12), transparent 0.2rem),
        radial-gradient(circle at 25% 42%, rgba(158, 231, 255, 0.12), transparent 0.16rem),
        radial-gradient(circle at 76% 39%, rgba(199, 166, 255, 0.13), transparent 0.18rem),
        radial-gradient(circle at 58% 70%, rgba(255, 255, 255, 0.10), transparent 0.12rem);
      opacity: 0.85;
    }

    a { color: inherit; text-decoration: none; }

    .topbar {
      position: fixed;
      top: 28px;
      left: 50%;
      z-index: 20;
      width: min(1120px, calc(100vw - 40px));
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(5, 8, 15, 0.58);
      backdrop-filter: blur(20px) saturate(140%);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.24);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .brand::before {
      content: "";
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff, var(--accent) 35%, #5378ff 75%);
      box-shadow: 0 0 28px rgba(158, 231, 255, 0.65);
    }

    .topbar nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .topbar nav a,
    .topbar nav button {
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 9px 13px;
      color: rgba(245, 247, 251, 0.72);
      background: transparent;
      font: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 180ms ease;
    }

    .topbar nav form { margin: 0; }

    .topbar nav a:hover,
    .topbar nav button:hover {
      color: var(--ink);
      border-color: var(--line);
      background: rgba(255, 255, 255, 0.08);
    }

    .page {
      position: relative;
      width: min(1200px, calc(100vw - 40px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 150px 0 90px;
    }

    .space-stage {
      position: relative;
      min-height: calc(100vh - 210px);
      perspective: 1200px;
      isolation: isolate;
    }

    .space-stage::before {
      content: "";
      position: absolute;
      top: 5vh;
      right: 4%;
      width: min(44vw, 520px);
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 34% 28%, rgba(255,255,255,0.82), rgba(158,231,255,0.34) 10%, rgba(74,96,255,0.16) 32%, transparent 66%),
        radial-gradient(circle at 60% 65%, rgba(199,166,255,0.18), transparent 45%);
      filter: blur(0.1px);
      opacity: 0.68;
      transform: translateZ(-220px);
      z-index: -1;
    }

    .space-stage::after {
      content: "";
      position: absolute;
      left: -12%;
      top: 22vh;
      width: 40vw;
      height: 40vw;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 46% 54% 57% 43%;
      transform: rotateX(66deg) rotateZ(-18deg) translateZ(-160px);
      opacity: 0.45;
      box-shadow: inset 0 0 90px rgba(158,231,255,0.08);
      z-index: -1;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: rgba(245,247,251,0.88);
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(16px);
      box-shadow: 0 16px 42px rgba(0,0,0,0.20);
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
    }

    .button:hover {
      transform: translateY(-2px);
      border-color: var(--line-strong);
      background: rgba(255,255,255,0.10);
    }

    .button.primary {
      color: #061018;
      border-color: transparent;
      background: linear-gradient(135deg, #ffffff, var(--accent));
      box-shadow: 0 20px 60px rgba(158,231,255,0.20);
    }

    .muted { color: var(--muted); }

    .notice {
      margin: 26px 0;
      padding: 18px 20px;
      border: 1px solid rgba(255, 211, 138, 0.28);
      border-radius: 24px;
      color: rgba(255, 240, 210, 0.88);
      background: rgba(255, 211, 138, 0.08);
      backdrop-filter: blur(18px);
    }

    @media (max-width: 820px) {
      .topbar {
        top: 14px;
        width: calc(100vw - 24px);
        border-radius: 28px;
        align-items: flex-start;
        flex-direction: column;
      }

      .topbar nav { justify-content: flex-start; }
      .page { width: min(100% - 24px, 1200px); padding-top: 178px; }
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'dashboard' %}">TraitMirror</a>
    <nav>
      {% if user.is_authenticated %}
        <a href="{% url 'ideal_profile' %}">Ideal self</a>
        <a href="{% url 'assessment' %}">Assessment</a>
        <a href="{% url 'daily_plan' %}">Growth</a>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit">Log out</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}">Log in</a>
        <a href="{% url 'signup' %}">Sign up</a>
      {% endif %}
    </nav>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
  <script>
    window.addEventListener('pointermove', (event) => {
      const x = (event.clientX / window.innerWidth - 0.5).toFixed(3);
      const y = (event.clientY / window.innerHeight - 0.5).toFixed(3);
      document.documentElement.style.setProperty('--mx', x);
      document.documentElement.style.setProperty('--my', y);
    }, { passive: true });
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
